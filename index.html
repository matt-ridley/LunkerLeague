<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lunker League">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0B4F5C">
<meta name="format-detection" content="telephone=no">
<meta name="description" content="Track your bests. Settle the bet.">
<title>Lunker League</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Figtree:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="css/app.css">
</head>
<body class="gated">
<header id="top" class="top" hidden></header>
<main id="main"></main>
<nav id="nav" class="nav" hidden aria-label="Main"></nav>
<aside id="panel" class="panel" hidden aria-label="Side panel"></aside>
<div id="scrim" class="scrim" hidden></div>
<section id="sheet" class="sheet" role="dialog" aria-modal="true" hidden></section>
<div id="toast" class="toast" role="status" aria-live="polite" hidden>
  <span id="toast-text"></span>
  <button id="toast-action" class="toast-btn" type="button" hidden></button>
</div>
<noscript><p style="padding:24px">Lunker League needs JavaScript turned on.</p></noscript>
<script type="module" src="js/main.js"></script>
</body>
</html>
