<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lunker League">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0B4F5C">
<meta name="format-detection" content="telephone=no">
<meta name="description" content="Track your bests. Settle the bet.">
<title>Lunker League</title>
<script>
/* Start-up safety net: if the app hasn't drawn anything after a few seconds, say so (with what went wrong) instead of
   leaving a blank screen. Plain script before the stylesheets so it runs even if the rest of the page is stuck. */
(function () {
  var errs = [];
  addEventListener("error", function (e) {
    var t = e.target;
    errs.push(t && t !== window ? "Couldn't load " + (t.src || t.href || t.tagName) : (e.message || "Error") + (e.filename ? " (" + e.filename.split("/").pop() + ":" + e.lineno + ")" : ""));
  }, true);
  addEventListener("unhandledrejection", function (e) { errs.push("Unhandled: " + ((e.reason && (e.reason.message || e.reason)) || "?")); });
  setTimeout(function () {
    var main = document.getElementById("main");
    if (!main || main.childElementCount) return; // it started
    var box = document.createElement("div");
    box.setAttribute("style", "position:fixed;inset:0;z-index:99;overflow:auto;padding:32px 20px;background:#0B4F5C;color:#fff;font:16px/1.45 system-ui,sans-serif");
    box.innerHTML = "<h1 style='margin:0 0 8px;font-size:24px'>Lunker League didn't start</h1>" +
      "<p style='margin:0 0 16px'>Try Reload. If this keeps happening, send a screenshot of this screen.</p>" +
      "<button type='button' style='font:inherit;font-weight:700;padding:12px 20px;border:0;border-radius:12px;background:#C5F23A;color:#0C1A14'>Reload</button>" +
      "<pre style='white-space:pre-wrap;word-break:break-word;font-size:12px;opacity:.85;margin-top:20px'></pre>";
    box.querySelector("button").onclick = function () { location.reload(); };
    var info = box.querySelector("pre");
    var lines = ["Online: " + navigator.onLine, "Worker: " + !!(navigator.serviceWorker && navigator.serviceWorker.controller), "Page: " + location.href].concat(errs.length ? errs : ["No errors caught"]);
    info.textContent = lines.join("\n");
    document.body.appendChild(box);
    // Which saved files the phone has (the app opens with no signal from these).
    if (window.caches) caches.keys().then(function (ks) {
      return Promise.all(ks.map(function (k) { return caches.open(k).then(function (c) { return c.keys(); }).then(function (r) { return k + ": " + r.length + " files"; }); }));
    }).then(function (ls) { info.textContent += "\nSaved: " + (ls.join(", ") || "none"); }, function () {});
  }, 8000);
})();
</script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Fonts load without holding up the page: with no signal the request can hang, and a normal stylesheet would leave
     the screen blank (and the app's code waiting) until it gave up. The phone's own font shows until they arrive. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Figtree:wght@400;500;600;700;800&display=swap" media="print" onload="this.media='all'">
<link rel="stylesheet" href="css/app.css">
</head>
<body class="gated">
<header id="top" class="top" hidden></header>
<main id="main"></main>
<nav id="nav" class="nav" hidden aria-label="Main"></nav>
<aside id="panel" class="panel" hidden aria-label="Side panel"></aside>
<div id="scrim" class="scrim" hidden></div>
<section id="sheet" class="sheet" role="dialog" aria-modal="true" hidden></section>
<div id="toast" class="toast" role="status" aria-live="polite" hidden>
  <span id="toast-text"></span>
  <button id="toast-action" class="toast-btn" type="button" hidden></button>
</div>
<noscript><p style="padding:24px">Lunker League needs JavaScript turned on.</p></noscript>
<script type="module" src="js/main.js"></script>
</body>
</html>
